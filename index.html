    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(to bottom, #1b381e, #0e2011);
      color: #fff; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; overflow: hidden; position: relative;
    }
    .vines {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }
    .vine { position: absolute; top: 0; width: 4px; background: #2d5a27; height: 120px; }
    .v1 { left: 10%; } .v2 { left: 88%; height: 150px; }
    
    .monkey {
      position: absolute; top: 80px; font-size: 2.5rem;
      animation: swing 3s ease-in-out infinite alternate; transform-origin: top center;
    }
    .m1 { left: 8%; animation-delay: 0s; }
    .m2 { left: 86%; animation-delay: 1.5s; }

    @keyframes swing {
      0% { transform: rotate(-25deg); }
      100% { transform: rotate(25deg); }
    }

    .game-card {
      background: rgba(20, 45, 23, 0.95); border: 2px solid #4caf50;
      border-radius: 20px; padding: 30px; width: 90%; max-width: 500px;
      text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative; z-index: 10; backdrop-filter: blur(5px);
    }

    .title-main {
      font-size: 2.2rem;
      font-weight: 900;
      color: #8bc34a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }

    .author-credit {
      font-size: 1rem;
      font-weight: 600;
      color: #ffeb3b;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    h2 { color: #8bc34a; font-size: 2.2rem; margin-bottom: 15px; }
    p { margin-bottom: 20px; color: #ddf0d3; font-size: 1.1rem; line-height: 1.4; }

    .counter { font-size: 0.95rem; color: #8bc34a; margin-bottom: 12px; font-weight: bold; }

    .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button {
      padding: 12px 20px; border: none; border-radius: 10px; font-weight: bold;
      cursor: pointer; transition: transform 0.1s, background 0.2s; font-size: 1rem;
    }
    button:active { transform: scale(0.95); }
    .btn-yes { background: #4caf50; color: #fff; }
    .btn-no { background: #f44336; color: #fff; }
    .btn-idk { background: #ff9800; color: #fff; }
    .btn-action { background: #8bc34a; color: #1b381e; width: 100%; margin-top: 15px; }

    .result-icon { font-size: 5.5rem; margin: 15px 0; display: flex; justify-content: center; align-items: center; }
    .custom-img { width: 220px; height: auto; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
  </style>
</head>

      { name: "Orangutan", emoji: "🦧", traits: { water: false, fly: false, carnivore: false, large: false, fourLegs: false, eggs: false, pet: false, fur: true, cold: false, pattern: false, bug: false, treeTail: true, reptileAmphibian: false, slow: false, longFeature: false, maskPattern: false, regenerate: false, blackCat: false, spikes: false, farm: false } },
      { name: "Monkey", emoji: "🐒", traits: { water: false, fly: false, carnivore: false, large: false, fourLegs: false, eggs: false, pet: false, fur: true, cold: false, pattern: false, bug: false, treeTail: true, reptileAmphibian: false, slow: false, longFeature: false, maskPattern: false, regenerate: false, blackCat: false, spikes: false, farm: false } },
      { name: "Kangaroo", emoji: "🦘", traits: { water: false, fly: false, carnivore: false, large: true, fourLegs: false, eggs: false, pet: false, fur: true, cold: false, pattern: false, bug: false, treeTail: false, reptileAmphibian: false, slow: false, longFeature: false, maskPattern: false, regenerate: false, blackCat: false, spikes: false, farm: false } },
      { name: "Crocodile", emoji: "🐊", traits: { water: true, fly: false, carnivore: true, large: true, fourLegs: true, eggs: true, pet: false, fur: false, cold: false, pattern: false, bug: false, treeTail: false, reptileAmphibian: true, slow: false, longFeature: false, maskPattern: false, regenerate: false, blackCat: false, spikes: false, farm: false } },
      { name: "Frog", emoji: "🐸", traits: { water: true, fly: false, carnivore: true, large: false, fourLegs: true, eggs: true, pet: false, fur: false, cold: false, pattern: false, bug: false, treeTail: false, reptileAmphibian: true, slow: false, longFeature: false, maskPattern: false, regenerate: false, blackCat: false, spikes: false, farm: false } },
      { name: "Butterfly", emoji: "🦋", traits: { water: false, fly: true, carnivore: false, large: false, fourLegs: false, eggs: true, pet: false, fur: false, cold: false, pattern: true, bug: true, treeTail: false, reptileAmphibian: false, slow: false, longFeature: false, maskPattern: false, regenerate: false, blackCat: false, spikes: false, farm: false } },
      { name: "Honeybee", emoji: "🐝", traits: { water: false, fly: true, carnivore: false, large: false, fourLegs: false, eggs: true, pet: false, fur: true, cold: false, pattern: true, bug: true, treeTail: false, reptileAmphibian: false, slow: false, longFeature: false, maskPattern: false, regenerate: false, blackCat: false, spikes: false, farm: false } }
    ];

    let candidates = [];
    let askedKeys = [];
    let qCount = 0;

    function startGame() {
      candidates = [...animals];
      askedKeys = [];
      qCount = 0;
      askNextQuestion();
    }

    function askNextQuestion() {
      if (candidates.length <= 2 || askedKeys.length >= questions.length) {
        makeGuess();
        return;
      }

      let bestQ = null;
      let bestDiff = Infinity;

      for (let q of questions) {
        if (askedKeys.includes(q.key)) continue;

        let yesCount = candidates.filter(a => a.traits[q.key] === true).length;
        let noCount = candidates.filter(a => a.traits[q.key] === false).length;
        let diff = Math.abs(yesCount - noCount);

        if (diff < bestDiff) {
          bestDiff = diff;
          bestQ = q;
        }
      }

      if (!bestQ) {
        makeGuess();
        return;
      }

      askedKeys.push(bestQ.key);
      qCount++;

      document.getElementById('content').innerHTML = `
        <div class="counter">Question ${qCount} | Candidates Remaining: ${candidates.length}</div>
        <p><strong>${bestQ.text}</strong></p>
        <div class="btn-group">
          <button class="btn-yes" onclick="answer('${bestQ.key}', true)">Yes</button>
          <button class="btn-no" onclick="answer('${bestQ.key}', false)">No</button>
          <button class="btn-idk" onclick="answer('${bestQ.key}', null)">I Don't Know</button>
        </div>
      `;
    }

    function answer(key, val) {
      if (val !== null) {
        candidates = candidates.filter(a => a.traits[key] === val);
      }
      
      if (candidates.length === 0) {
        candidates = [...animals];
      }

      askNextQuestion();
    }

    function makeGuess() {
      const best = candidates[0] || animals[0];
      const displayGraphic = best.customSvg ? best.customSvg : best.emoji;
      
      document.getElementById('content').innerHTML = `
        <p>I narrowed it down! Is your animal a...</p>
        <div class="result-icon">${displayGraphic}</div>
        <h2>${best.name}!</h2>
        <button class="btn-action" onclick="startGame()">Play Again</button>
      `;
    }
  </script>
